[package]
name = "mybot"
version = "0.1.0"
edition = "2024"

[dependencies]
nonebot_rs = {git = "https://github.com/31207/nonebot-rs.git", branch = "main"}
builtin_plugins = {git = "https://github.com/31207/nonebot-rs.git", branch = "main"}

huoziyinshua_rs = {git = "https://github.com/31207/huoziyinshua-rs.git", branch = "main"}
toml = "1.1.2"
rcnb-rs = "0.1.0"
serde_json = "1.0.66"
reqwest = { version = "0.12", features = ["json","blocking"] }
base64 = "0.22.1"
clap = { version = "4.5.60", features = ["derive"] }
anyhow = "1.0.102"
rand = "0.10.0"

[dependencies.tracing]
version = "0.1"
features = ["std"]

[dependencies.tokio]
version = "1.10.0"
features = ["sync"]


[dependencies.serde]
version = "1.0"
features = ["derive"]
